# Render Blueprint: hosts the School Hack web app (backend-python) on the free plan.
# Render → New → Blueprint → this repository, branch safick_v1. See docs/DEPLOY_RENDER.md.
#
# Free plan notes: the service sleeps after 15 minutes without visits (the next
# visit takes about a minute), and the SQLite demo data starts fresh after each
# deploy or restart. The textbook search server (vectorstore/) is not deployed;
# no page needs it, the AI tutor answers directly via OpenRouter.
services:
  - type: web
    name: schoolhack
    runtime: python
    plan: free
    branch: safick_v1
    rootDir: backend-python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Signs the login cookie. Generated by Render, never stored in the repo.
      - key: SESSION_SECRET
        generateValue: true
      # Paste your key in the Render dashboard (it is not stored in the repo).
      # Without it everything works except free AI tutor answers.
      - key: OPENROUTER_API_KEY
        sync: false
