<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>School Hack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: one playful "lab notebook" column, big touch targets, one view at a time. Single bright look by design. */
:root {
  color-scheme: light;
  --sky: #e9f4ff;        /* page ground */
  --ink: #1d2550;        /* text */
  --muted: #5b6390;
  --card: #ffffff;
  --grape: #6c4bf4;      /* primary */
  --grape-d: #5133d6;
  --sun: #ffc93c;        /* stars, highlights */
  --mint: #22c58b;       /* correct / pass */
  --mint-l: #ddf8ec;
  --coral: #ff5d6c;      /* wrong / fail */
  --coral-l: #ffe5e8;
  --berry: #ff8fb3;
  --line: #d7e3f4;
  --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 500 18px/1.5 var(--font-body);
  background-image: radial-gradient(circle at 12% 8%, #fff6d6 0 120px, transparent 121px), radial-gradient(circle at 92% 30%, #f0e9ff 0 160px, transparent 161px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 700; }
h2 { font-size: 1.6rem; font-weight: 600; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 3px solid var(--line); }
.top .wrap { padding-block: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; color: var(--grape); background: none; border: 0; padding: 0; }
.brand svg { width: 40px; height: 40px; }
.chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-weight: 800; background: var(--sky); }
.pill.star { background: #fff4cc; color: #8a5a00; }
.linkbtn { background: none; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 800; color: var(--muted); }
.linkbtn:hover { border-color: var(--grape); color: var(--grape); }

/* generic */
.card { background: var(--card); border-radius: 28px; padding: 24px; box-shadow: 0 6px 0 var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 14px 28px; border: 0; border-radius: 20px;
  font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; background: var(--grape); color: #fff; box-shadow: 0 6px 0 var(--grape-d); transition: transform .08s, box-shadow .08s; }
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--grape-d); }
.btn.sun { background: var(--sun); color: var(--ink); box-shadow: 0 6px 0 #e0a400; }
.btn.mint { background: var(--mint); box-shadow: 0 6px 0 #149a6a; }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: 0 6px 0 var(--line); border: 3px solid var(--line); }
.btn.wide { width: 100%; }
.stack { display: grid; gap: 16px; }
.muted { color: var(--muted); }

/* mascot */
.mascot { width: 120px; height: 120px; flex: none; }
.mascot .orbit { transform-origin: 60px 60px; animation: spin 9s linear infinite; }
.mascot .orbit.b { animation-duration: 13s; animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.bounce { animation: bounce .6s ease; }
@keyframes bounce { 30% { transform: translateY(-14px) scale(1.05); } 60% { transform: translateY(0); } }
.shake { animation: shake .45s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { .mascot .orbit, .bounce, .shake { animation: none; } }
.bubble { position: relative; background: var(--card); border-radius: 22px; padding: 14px 18px; font-weight: 700; box-shadow: 0 4px 0 var(--line); }
.bubble::before { content: ""; position: absolute; left: -12px; top: 26px; border: 8px solid transparent; border-right: 12px solid var(--card); }

/* login */
.login { display: grid; gap: 24px; grid-template-columns: 1fr; align-items: center; padding-top: 12px; }
@media (min-width: 820px) { .login { grid-template-columns: 1fr 1fr; } }
.hello { display: flex; gap: 14px; align-items: center; }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.role { border: 4px solid var(--line); background: var(--card); border-radius: 22px; padding: 16px 10px; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.role .ico { font-size: 2.6rem; display: block; line-height: 1.2; }
.role[aria-pressed="true"] { border-color: var(--grape); background: #f1ecff; color: var(--grape-d); }
label.f { display: grid; gap: 6px; font-weight: 800; }
.in { width: 100%; border: 3px solid var(--line); border-radius: 18px; padding: 14px 16px; font-size: 1.2rem; background: #fbfdff; }
.in:focus { border-color: var(--grape); outline: none; }
.err { background: var(--coral-l); color: #b3172a; border-radius: 16px; padding: 10px 14px; font-weight: 800; }
.hint-demo { text-align: center; color: var(--muted); }

/* subjects */
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 820px) { .grid2.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.subject { border: 0; text-align: left; border-radius: 28px; padding: 22px; min-height: 170px; display: flex; flex-direction: column; justify-content: space-between; color: var(--ink); box-shadow: 0 6px 0 rgba(29,37,80,.12); }
.subject .big { font-size: 3rem; line-height: 1; }
.subject b { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; }
.subject small { font-weight: 800; opacity: .75; }
.subject.locked { opacity: .55; cursor: not-allowed; }

/* chem home */
.hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; background: var(--grape); color: #fff; box-shadow: 0 6px 0 var(--grape-d); }
.hero .txt { flex: 1 1 260px; display: grid; gap: 10px; }
.hero .muted { color: #e4dcff; }
.topic { display: grid; gap: 12px; }
.skill { display: grid; gap: 6px; }
.skill .row { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
.meter { height: 16px; border-radius: 999px; background: var(--sky); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; }
.stars { color: var(--sun); letter-spacing: 2px; font-size: 1.1rem; white-space: nowrap; }

/* quiz */
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; }
.track { height: 20px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 3px var(--line); overflow: hidden; }
.track i { display: block; height: 100%; background: linear-gradient(90deg, var(--grape), var(--berry)); border-radius: 999px; transition: width .3s; }
.qcard { display: grid; gap: 18px; }
.qtag { justify-self: start; background: #f1ecff; color: var(--grape-d); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: .9rem; }
.qtext { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.4rem, 3.6vw, 1.9rem); line-height: 1.3; }
.opts { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .opts { grid-template-columns: 1fr 1fr; } }
.opt { display: flex; align-items: center; gap: 14px; min-height: 72px; border: 4px solid var(--line); background: var(--card); border-radius: 22px; padding: 12px 16px; text-align: left; font-size: 1.25rem; font-weight: 800; transition: transform .08s; }
.opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--grape); }
.opt .k { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-family: var(--font-display); flex: none; }
.opt.ok { border-color: var(--mint); background: var(--mint-l); }
.opt.no { border-color: var(--coral); background: var(--coral-l); }
.opt:disabled { cursor: default; }
.numrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.numrow .in { font-size: 1.6rem; max-width: 260px; }
.unit { font-weight: 800; font-size: 1.3rem; color: var(--muted); }
.fb { border-radius: 22px; padding: 16px 18px; font-weight: 800; display: flex; gap: 12px; align-items: flex-start; }
.fb.ok { background: var(--mint-l); color: #0b6b48; }
.fb.no { background: var(--coral-l); color: #a3142a; }
.fb .em { font-size: 2rem; line-height: 1; }
.tip { background: #fff4cc; border-radius: 20px; padding: 14px 16px; font-weight: 700; }
.tipbtn { justify-self: start; background: none; border: 0; color: var(--grape-d); font-weight: 800; font-size: 1.1rem; padding: 6px 0; }
.qfoot { display: flex; gap: 12px; flex-wrap: wrap; }
.qfoot .btn { flex: 1 1 200px; }

/* result */
.score { font-family: var(--font-display); font-weight: 700; font-size: clamp(4rem, 14vw, 6.5rem); line-height: 1; }
.center { text-align: center; justify-items: center; }
.badge { display: inline-block; border-radius: 999px; padding: 8px 18px; font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; }
.badge.ok { background: var(--mint-l); color: #0b6b48; }
.badge.no { background: var(--coral-l); color: #a3142a; }
.passbar { position: relative; width: 100%; height: 22px; border-radius: 999px; background: var(--sky); overflow: hidden; }
.passbar i { display: block; height: 100%; }
.passbar b { position: absolute; top: -4px; bottom: -4px; width: 4px; background: var(--ink); border-radius: 4px; }
canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* teacher */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi { text-align: center; padding: 18px 10px; }
.kpi .v { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 6vw, 2.8rem); line-height: 1.1; white-space: nowrap; }
.kpi .l { color: var(--muted); font-weight: 800; }
.charts { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .charts { grid-template-columns: 2fr 1fr; } }
.chartbox { position: relative; height: 320px; }
.chartbox.tall { height: 460px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-weight: 800; font-size: .95rem; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 6px; vertical-align: -2px; background: currentColor; }
.seg { display: inline-flex; background: var(--card); border-radius: 999px; padding: 4px; box-shadow: inset 0 0 0 3px var(--line); }
.seg button { border: 0; background: none; border-radius: 999px; padding: 8px 16px; font-weight: 800; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--grape); color: #fff; }
.agent { background: var(--ink); color: #fff; box-shadow: 0 6px 0 #0d1333; }
.agent .muted { color: #b9c0e8; }
.steps { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .steps { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.step { border-radius: 16px; padding: 10px 12px; background: rgba(255,255,255,.08); color: #b9c0e8; font-size: .9rem; font-weight: 700; }
.step.run { background: rgba(255,201,60,.2); color: #fff; }
.step.done { background: rgba(34,197,139,.22); color: #fff; }
.gaps { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .gaps { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.gap { background: var(--card); color: var(--ink); border-radius: 20px; padding: 14px; display: grid; gap: 4px; min-width: 0; }
.gap .sev { justify-self: start; border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: .8rem; }
.sumbox { background: #fff4cc; color: var(--ink); border-radius: 20px; padding: 14px 16px; font-weight: 700; }
.acts { display: grid; gap: 8px; margin: 0; padding-left: 1.2em; }
.example { font-size: .85rem; color: var(--muted); font-weight: 700; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lang { display: inline-flex; background: var(--sky); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-weight: 800; color: var(--muted); min-width: 44px; }
.lang button[aria-pressed="true"] { background: var(--grape); color: #fff; }
.brand span b { color: var(--sun); -webkit-text-stroke: 0; }
.foot { text-align: center; color: var(--muted); font-weight: 700; font-size: .9rem; padding-block: 8px 24px; }
.brand { white-space: nowrap; }
.top .wrap { flex-wrap: nowrap; }
.topics { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .topics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) {
  .brand { font-size: 1.1rem; gap: 6px; }
  .brand svg { width: 32px !important; height: 32px !important; }
  .chips { gap: 5px; flex-wrap: nowrap; }
  .pill { padding: 5px 8px; font-size: .9rem; }
  .lang button { padding: 5px 8px; min-width: 36px; font-size: .9rem; }
  .linkbtn { padding: 5px 10px; font-size: .9rem; }
}
@media (max-width: 380px) { .brand span { display: none; } }
.pill, .linkbtn, .lang button { white-space: nowrap; }
@media (max-width: 520px) { .pill.role-pill { display: none; } }

/* archify: the app explained as two live diagrams (technical + business) */
.footlink { background: none; border: 0; padding: 0; font-weight: 800; color: var(--grape-d); text-decoration: underline; text-underline-offset: 3px; }
.ax-promo { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 20px; background: var(--ink); color: #fff; box-shadow: 0 6px 0 #0d1333; }
.ax-promo .txt { flex: 1 1 260px; display: grid; gap: 6px; }
.ax-promo .muted { color: #b9c0e8; }
.ax-promo .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn.sm { min-height: 48px; padding: 8px 18px; font-size: 1.05rem; border-radius: 16px; }
.ax-ctrl { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ax-ctrl, .ax-card, .ax-grid, .ax-grid > * { min-width: 0; }  /* keep the wide diagram from stretching the page */
.seg.wrap { flex-wrap: wrap; border-radius: 24px; }
.ax-card { padding: 10px; }
.ax-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; border-radius: 20px; }
.ax-svg { display: block; width: 100%; min-width: 760px; height: auto; }
.ax-svg .zone text { font: 800 12px var(--font-body); letter-spacing: .08em; fill: var(--muted); }
.ax-svg .node { cursor: pointer; outline: none; transform-box: fill-box; transform-origin: center; transition: opacity .2s; }
.ax-svg .node rect { fill: #fff; stroke: var(--line); stroke-width: 3; transition: fill .2s, stroke .2s; }
.ax-svg .node .t { font: 600 15.5px var(--font-display); fill: var(--ink); }
.ax-svg .node .s { font: 700 12px var(--font-body); fill: var(--muted); }
.ax-svg .node .ico { font-size: 22px; }
.ax-svg .node:hover rect, .ax-svg .node:focus-visible rect { stroke: var(--grape); }
.ax-svg .node:focus-visible rect { stroke: var(--sun); stroke-width: 5; }
.ax-svg .node.is-on rect { stroke: var(--grape); fill: #f1ecff; }
.ax-svg .node.is-sel rect { stroke: var(--sun); stroke-width: 5; fill: #fffaf0; }
.ax-svg .edge { transition: opacity .2s; }
.ax-svg .edge path { fill: none; stroke: #b9c8e2; stroke-width: 2.5; marker-end: url(#axArr); }
.ax-svg .edge text { font: 800 12px var(--font-body); fill: var(--muted); text-anchor: middle; paint-order: stroke; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; }
.ax-svg .edge text.st { text-anchor: start; }
.ax-svg.build .node { animation: axpop .45s cubic-bezier(.3, 1.5, .6, 1) both; animation-delay: calc(var(--i) * 45ms); }
.ax-svg.build .edge path { stroke-dasharray: var(--len); animation: axdraw .6s ease both; animation-delay: calc(var(--i) * 40ms + 350ms); }
.ax-svg .edge.is-on path, .ax-svg .edge.is-hl path { stroke: var(--grape); stroke-width: 3.5; marker-end: url(#axArrOn); }
.ax-svg .edge.is-on text, .ax-svg .edge.is-hl text { fill: var(--grape-d); }
.ax-svg .edge.is-now path { stroke-dasharray: 9 7; animation: axflow .6s linear infinite; }
.ax-svg.hovering .node:not(.is-hl) { opacity: .4; }
.ax-svg.hovering .edge:not(.is-hl) { opacity: .25; }
.ax-svg .packet { fill: var(--sun); stroke: var(--ink); stroke-width: 2.5; opacity: 0; }
@keyframes axpop { from { opacity: 0; transform: scale(.85); } }
@keyframes axdraw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
@keyframes axflow { to { stroke-dashoffset: -16; } }
@media (prefers-reduced-motion: reduce) { .ax-svg *, .ax-svg.build * { animation: none !important; } }
.ax-cap { color: var(--muted); font-weight: 700; font-size: .95rem; padding: 8px 10px 4px; }
.ax-grid { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 860px) { .ax-grid { grid-template-columns: 1fr 1fr; } }
.ax-eyebrow { font-weight: 800; color: var(--grape-d); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; }
.ax-steps { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.ax-steps button { border: 3px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: .9rem; color: var(--muted); }
.ax-steps button.done { border-color: #cdbfff; color: var(--grape-d); }
.ax-steps button[aria-current] { border-color: var(--grape); background: var(--grape); color: #fff; }
.ax-nav { display: flex; gap: 10px; flex-wrap: wrap; }
.ax-nav .btn { flex: 1 1 120px; }
.ax-log { display: grid; gap: 10px; max-height: 360px; overflow-y: auto; padding-right: 4px; scroll-behavior: smooth; }
.msg { display: flex; gap: 10px; align-items: flex-start; animation: axin .25s ease both; }
.msg .av { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.12); display: grid; place-items: center; font-size: 1.25rem; flex: none; }
.msg .bub { background: rgba(255,255,255,.09); border-radius: 4px 16px 16px 16px; padding: 8px 12px; font-weight: 700; font-size: .95rem; min-width: 0; overflow-wrap: anywhere; }
.msg .who { display: block; color: var(--sun); font-size: .8rem; font-weight: 800; }
.msg.me { flex-direction: row-reverse; }
.msg.me .bub { background: var(--grape); border-radius: 16px 4px 16px 16px; }
.msg.sys .bub { background: rgba(255,201,60,.16); }
@keyframes axin { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
.qchips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchips button { border: 0; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: .9rem; background: rgba(255,255,255,.12); color: #fff; }
.qchips button:hover { background: rgba(255,255,255,.22); }
.ax-ask { display: flex; gap: 8px; }
.ax-ask .in { padding: 10px 14px; font-size: 1rem; min-width: 0; }
.ax-ask .btn { flex: none; }
</style>

<header class="top">
  <div class="wrap">
    <button class="brand" id="brand" type="button" aria-label="School Hack"></button>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer class="foot wrap" id="foot"></footer>
<canvas id="confetti" hidden></canvas>

<script>
/* ============================================================
   School Hack – Grade 9 chemistry (RLP Berlin-Brandenburg), DE + EN
   Questions are generated and graded in code. Claude only gives hints.
   ============================================================ */
const PASS = 20, TOTAL = 30, VERSION = 'v1.0';

// ---------- language ----------
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let lang = store.get('sh_lang') || ((navigator.language || 'de').startsWith('de') ? 'de' : 'en');
const D = (de, en) => ({ de, en });                       // bilingual text
const L = x => x && typeof x === 'object' && 'de' in x ? (x[lang] ?? x.de) : x;  // pick current language
const K = x => x && typeof x === 'object' && 'de' in x ? x.de : x;              // canonical key

const gcd = (a, b) => b ? gcd(b, a % b) : a, lcm = (a, b) => a * b / gcd(a, b);
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

function mc(skill, prompt, answer, wrong, explanation, traps = {}) {
  const seen = new Set([K(answer)]), opts = [answer];
  for (const w of wrong) if (!seen.has(K(w)) && opts.length < 4) { seen.add(K(w)); opts.push(w); }
  return { skill, kind: 'mc', prompt, answer: K(answer), options: shuffle(opts), explanation, traps };
}

function buildTest() {
  const ids = Object.keys(SKILLS), plan = shuffle([...ids, ...ids]), seen = new Set(), qs = [];
  plan.forEach((s, i) => { let q; for (let k = 0; k < 12; k++) { q = T[s](); if (!seen.has(K(q.prompt))) break; } seen.add(K(q.prompt)); q.id = 'q' + i; qs.push(q); });
  return qs;
}
const toNum = s => { const v = parseFloat(String(s).trim().replace(',', '.').replace('−', '-')); return isNaN(v) ? null : v; };
function grade(q, given) {
  if (q.kind === 'num') {
    const g = toNum(given); if (g === null) return { ok: false, msg: UI.enterNumber };
    if (Math.abs(g - q.answer) <= Math.max(Math.abs(q.answer) * .02, .01)) return { ok: true };
    for (const [tv, m] of Object.entries(q.traps)) if (Math.abs(g - +tv) <= Math.max(Math.abs(+tv) * .02, .01)) return { ok: false, msg: m };
    return { ok: false, msg: null };
  }
  return given === q.answer ? { ok: true } : { ok: false, msg: q.traps[given] || null };
}

// gap finder logic, shared by the teacher view and the Archify simulation
function analyse(d) {
  const mean = s => d.st.reduce((a, x) => a + x.mastery[s], 0) / d.st.length;
  const rows = Object.keys(SKILLS).map(s => ({ s, mean: mean(s), err: d.skill[s].n ? d.skill[s].w / d.skill[s].n : 0, below: d.st.filter(x => x.mastery[s] < .6).length }));
  const by = Object.fromEntries(rows.map(r => [r.s, r]));
  const weak = rows.filter(r => r.mean < .6 || r.err > .4).sort((a, b) => a.mean - b.mean).slice(0, 3);
  weak.forEach(w => { w.root = SKILLS[w.s].pre.filter(p => by[p].mean < .65).sort((a, b) => by[a].mean - by[b].mean)[0] || null; });
  const groups = {}; d.st.forEach(x => { const worst = Object.keys(x.mastery).sort((a, b) => x.mastery[a] - x.mastery[b])[0]; if (x.mastery[worst] < .6) (groups[worst] ||= []).push(x.name); });
  const gl = Object.entries(groups).sort((a, b) => b[1].length - a[1].length).slice(0, 3);
  const acts = weak.map(w => w.root ? (l => UI.actRoot(SKILLS[w.s].name[l], SKILLS[w.root].name[l], w.below)[l]) : (l => UI.actPlain(SKILLS[w.s].name[l])[l]));
  if (d.kpi.failed) acts.push(l => UI.actFail(d.kpi.failed)[l]);
  const summary = both(weak.length ? (l => UI.sumGap(SKILLS[weak[0].s].name[l], Math.round(weak[0].mean * 100))[l] + (weak[0].root ? UI.sumRoot(SKILLS[weak[0].root].name[l])[l] : '') + UI.sumPass(d.kpi.pass)[l]) : (l => UI.noGaps[l]));
  return { weak, acts, gl, summary };
}

const AXS = { lens: 'tech', flow: null, step: 0, sel: null, log: [], built: null, timer: null, raf: 0, run: 0, back: null };
const axA = () => ARCH[AXS.lens];
const axNode = id => axA().nodes.find(n => n.id === id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function axStop() { clearInterval(AXS.timer); AXS.timer = null; cancelAnimationFrame(AXS.raf); AXS.run++; }

function axSvg() {
  const A = axA(), arrow = (id, c) => `<marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="${c}"/></marker>`;
  return `<svg class="ax-svg${AXS.built !== AXS.lens ? ' build' : ''}" id="axSvg" viewBox="0 0 1080 470" role="img" aria-label="${esc(L(A.aria))}">
    <defs>${arrow('axArr', '#b9c8e2')}${arrow('axArrOn', '#6c4bf4')}</defs>
    ${A.zones.map(z => `<g class="zone"><rect x="${z.x}" y="16" width="240" height="440" rx="22" fill="${z.c}"/><text x="${z.x + 20}" y="44">${esc(L(z.t))}</text></g>`).join('')}
    ${A.edges.map((e, i) => `<g class="edge" data-edge="${e.id}" style="--i:${i}"><path d="${e.d}"/><text ${e.cls === 'st' ? 'class="st"' : ''} x="${e.lx}" y="${e.ly}"${e.cls === 'rot' ? ` transform="rotate(-90 ${e.lx} ${e.ly})"` : ''}>${esc(L(e.label))}</text></g>`).join('')}
    ${A.nodes.map((n, i) => { const cy = n.y + n.h / 2; return `<g class="node" data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(L(n.t))}" style="--i:${i}">
      <rect x="${n.x}" y="${n.y}" width="200" height="${n.h}" rx="16"/><text class="ico" x="${n.x + 26}" y="${cy + 8}" text-anchor="middle">${n.ico}</text>
      <text class="t" x="${n.x + 50}" y="${cy - 3}">${esc(L(n.t))}</text><text class="s" x="${n.x + 50}" y="${cy + 16}">${esc(L(n.s))}</text></g>`; }).join('')}
    <circle class="packet" r="7" cx="-20" cy="-20"/></svg>`;
}

function viewArch() {
  if (current !== viewArch) AXS.back = current;
  const A = axA();
  if (!A.flows[AXS.flow]) { AXS.flow = A.first; AXS.step = 0; }
  if (!AXS.log.length) AXS.log.push({ ico: '🗺️', who: 'Archify', text: UI.axHello, cls: 'sys' });
  mount(`<div class="stack">
    <div class="row-between"><div class="hello">${mascot('wow', 72)}<div><h1>${t('axTitle')}</h1><p class="muted">${t('axSub')}</p></div></div>
      <button class="btn ghost sm" id="axBack" type="button">${t('axBack')}</button></div>
    <div class="ax-ctrl">
      <div class="seg" role="group" aria-label="${t('axView')}">${['tech', 'biz'].map(l => `<button type="button" data-lens="${l}" aria-pressed="${AXS.lens === l}">${t(l === 'tech' ? 'axTech' : 'axBiz')}</button>`).join('')}</div>
      <div class="seg wrap" role="group" aria-label="${t('axFlow')}" id="axFlows">${Object.entries(A.flows).map(([k, f]) => `<button type="button" data-flow="${k}" aria-pressed="${AXS.flow === k}">${esc(L(f.name))}</button>`).join('')}</div>
      <button class="btn sun sm" id="axSim" type="button">${t(AXS.lens === 'tech' ? 'axSimT' : 'axSimB')}</button>
    </div>
    <div class="card ax-card"><div class="ax-scroll" id="axScroll">${axSvg()}</div><p class="ax-cap">${esc(L(A.caption))}</p></div>
    <div class="ax-grid">
      <div class="card stack" id="axPanel">
        <span class="ax-eyebrow" id="axEyebrow"></span><h2 id="axTitle"></h2><p id="axText"></p>
        <ol class="ax-steps" id="axSteps"></ol>
        <div class="ax-nav"><button class="btn ghost sm" id="axPrev" type="button">${t('axPrev')}</button><button class="btn sm" id="axPlay" type="button">${t('axPlay')}</button><button class="btn ghost sm" id="axNext" type="button">${t('axNext')}</button></div>
      </div>
      <div class="card agent stack">
        <div><h2 style="color:#fff">${t('axChat')}</h2><p class="muted">${t('axChatSub')}</p></div>
        <div class="ax-log" id="axLog" aria-live="polite"></div>
        <div class="qchips" role="group">${UI.axQs.map(L).map((q, i) => `<button type="button" data-q="${i}">${esc(q)}</button>`).join('')}</div>
        <form class="ax-ask" id="axForm"><input class="in" id="axIn" autocomplete="off" placeholder="${t('axAsk')}" aria-label="${t('axAsk')}"><button class="btn sun sm" type="submit">${t('axSend')}</button></form>
      </div>
    </div></div>`, viewArch);
  const svg = $('#axSvg');
  svg.querySelectorAll('.edge path').forEach(p => p.style.setProperty('--len', Math.ceil(p.getTotalLength())));
  if (AXS.built !== AXS.lens) { AXS.built = AXS.lens; setTimeout(() => svg.classList.remove('build'), 1600); }
  $('#axBack').onclick = () => (AXS.back || viewLogin)();
  document.querySelectorAll('[data-lens]').forEach(b => b.onclick = () => { if (AXS.lens !== b.dataset.lens) { AXS.lens = b.dataset.lens; AXS.flow = null; AXS.sel = null; viewArch(); axShow(0); } });
  document.querySelectorAll('[data-flow]').forEach(b => b.onclick = () => axSetFlow(b.dataset.flow));
  $('#axSim').onclick = axSim;
  $('#axPrev').onclick = () => { axPause(); axShow(AXS.step - 1); };
  $('#axNext').onclick = () => { axPause(); axShow(AXS.step + 1); };
  $('#axPlay').onclick = axPlay;
  $('#axSteps').onclick = e => { const b = e.target.closest('[data-step]'); if (b) { axPause(); axShow(+b.dataset.step); } };
  svg.querySelectorAll('.node').forEach(g => {
    g.onclick = () => axPick(g.dataset.node);
    g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); axPick(g.dataset.node); } };
    g.onmouseenter = g.onfocus = () => axHover(g.dataset.node);
    g.onmouseleave = g.onblur = () => axHover(null);
  });
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => axAsk(L(UI.axQs[+b.dataset.q])));
  $('#axForm').onsubmit = e => { e.preventDefault(); const v = $('#axIn').value.trim(); if (v) { $('#axIn').value = ''; axAsk(v); } };
  $('#axLog').innerHTML = AXS.log.map(axMsg).join(''); $('#axLog').scrollTop = 1e6;
  axPaint();
}

function axMsg(m) {
  return `<div class="msg ${m.cls || ''}"><span class="av" aria-hidden="true">${m.ico}</span><div class="bub"><span class="who">${esc(L(m.who))}</span>${esc(L(m.text))}</div></div>`;
}
function axSay(id, text, cls) {
  const n = id && axNode(id), m = n ? { ico: n.ico, who: n.t, text } : { ico: cls === 'me' ? '🙋' : '🗺️', who: cls === 'me' ? UI.axYou : 'Archify', text, cls: cls || 'sys' };
  AXS.log.push(m); if (AXS.log.length > 60) AXS.log.shift();
  const log = $('#axLog'); if (log && current === viewArch) { log.insertAdjacentHTML('beforeend', axMsg(m)); log.scrollTop = log.scrollHeight; }
}

// paint the current flow step onto the diagram and the step panel
function axPaint() {
  const svg = $('#axSvg'); if (!svg) return;
  const A = axA(), f = A.flows[AXS.flow], s = f.steps[AXS.step];
  svg.querySelectorAll('.is-on, .is-now, .is-sel').forEach(el => el.classList.remove('is-on', 'is-now', 'is-sel'));
  f.steps.slice(0, AXS.step + 1).forEach(x => x.e.forEach(id => svg.querySelector(`[data-edge="${id}"]`).classList.add('is-on')));
  s.e.forEach(id => svg.querySelector(`[data-edge="${id}"]`).classList.add('is-now'));
  s.n.forEach(id => svg.querySelector(`[data-node="${id}"]`).classList.add('is-on'));
  if (AXS.sel) { const g = svg.querySelector(`[data-node="${AXS.sel}"]`); if (g) g.classList.add('is-sel'); }
  document.querySelectorAll('[data-flow]').forEach(b => b.setAttribute('aria-pressed', b.dataset.flow === AXS.flow));
  const part = AXS.sel && axNode(AXS.sel);
  $('#axEyebrow').textContent = part ? t(AXS.lens === 'tech' ? 'axPartT' : 'axPartB') : `${L(f.name)} · ${L(UI.axStep(AXS.step + 1, f.steps.length))}`;
  $('#axTitle').textContent = part ? `${part.ico} ${L(part.t)}` : L(s.title);
  $('#axText').textContent = part ? L(part.about) : L(s.text);
  $('#axSteps').innerHTML = f.steps.map((x, i) => `<li><button type="button" data-step="${i}" class="${i < AXS.step ? 'done' : ''}"${i === AXS.step && !part ? ' aria-current="step"' : ''}>${i + 1}. ${esc(L(x.short))}</button></li>`).join('');
  $('#axPrev').disabled = AXS.step === 0; $('#axNext').disabled = AXS.step === f.steps.length - 1;
  $('#axPlay').textContent = AXS.timer ? t('axPause') : t('axPlay');
  // on narrow screens, scroll the diagram to the part that is working
  const sc = $('#axScroll'), ids = part ? [part.id] : s.n;
  if (sc.scrollWidth > sc.clientWidth + 4) { const k = svg.clientWidth / 1080, x = ids.reduce((a, id) => a + axNode(id).x + 100, 0) / ids.length; sc.scrollLeft = x * k - sc.clientWidth / 2; }
}
function axShow(i, quiet) {
  const f = axA().flows[AXS.flow]; AXS.step = Math.max(0, Math.min(i, f.steps.length - 1)); AXS.sel = null;
  const s = f.steps[AXS.step];
  axPaint(); axPacket(s.e[0]);
  if (!quiet) axSay(s.who, s.say);
}
function axSetFlow(k, quiet) { axPause(); AXS.flow = k; axSay(null, both(l => `— ${axA().flows[k].name[l]} —`)); axShow(0, quiet); }
function axPick(id) { axPause(); AXS.sel = id; axPaint(); const n = axNode(id); axSay(id, n.about); }
function axPause() { clearInterval(AXS.timer); AXS.timer = null; const p = $('#axPlay'); if (p) p.textContent = t('axPlay'); }
function axPlay() {
  if (AXS.timer) return axPause();
  const n = axA().flows[AXS.flow].steps.length;
  axShow(AXS.step >= n - 1 || AXS.sel ? 0 : AXS.step + 1);
  AXS.timer = setInterval(() => { if (AXS.step >= n - 1) return axPause(); axShow(AXS.step + 1); }, 3000);
  $('#axPlay').textContent = t('axPause');
}
function axHover(id) {
  const svg = $('#axSvg'); if (!svg) return;
  svg.querySelectorAll('.is-hl').forEach(el => el.classList.remove('is-hl'));
  svg.classList.toggle('hovering', !!id); if (!id) return;
  svg.querySelector(`[data-node="${id}"]`).classList.add('is-hl');
  axA().edges.filter(e => e.from === id || e.to === id).forEach(e => {
    svg.querySelector(`[data-edge="${e.id}"]`).classList.add('is-hl');
    svg.querySelector(`[data-node="${e.from === id ? e.to : e.from}"]`).classList.add('is-hl');
  });
}
// a sun-coloured dot travels along the edge that is working
function axPacket(id) {
  cancelAnimationFrame(AXS.raf);
  const svg = $('#axSvg'), dot = svg && svg.querySelector('.packet');
  if (!dot) return; dot.style.opacity = 0;
  if (!id || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const p = svg.querySelector(`[data-edge="${id}"] path`), len = p.getTotalLength(), t0 = performance.now();
  const frame = now => { const k = Math.min(1, (now - t0) / 1000), pt = p.getPointAtLength(len * (1 - (1 - k) ** 2));
    dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y); dot.style.opacity = k < 1 ? 1 : 0; if (k < 1) AXS.raf = requestAnimationFrame(frame); };
  AXS.raf = requestAnimationFrame(frame);
}

// questions are matched locally; nothing leaves the browser
const AX_INTENTS = [
  { re: /simul|probier|try|demo/, sim: true },
  { re: /bewert|benot|grade|grading|marks?\b|korrig|fair/, go: ['tech', 'test', 2], a: D('Der Code bewertet jede Antwort, nicht die KI: Auswahl exakt, Zahlen mit 2 % Toleranz, typische Fehler mit eigener Erklärung.', 'Code grades every answer, not AI: choices exactly, numbers within 2 %, typical mistakes with their own explanation.') },
  { re: /daten|data|speicher|stored|privacy|datenschutz|localstorage/, go: ['tech', 'data', 0], a: D('In der Website bleibt alles im localStorage deines Browsers. Die Python-Version nutzt SQLite. An Claude gehen nie Namen.', 'On the website everything stays in your browser’s localStorage. The Python version uses SQLite. Names never go to Claude.') },
  { re: /tipp|hint|hilfe|help|stuck|hänge/, go: ['tech', 'hint', 0], a: D('Erst ein Denkanstoß, dann der Lösungsweg. Auf claude.ai formuliert Claude ihn, sonst nimmt die App ihre eingebauten Tipps.', 'First a nudge, then the method. On claude.ai Claude phrases it; otherwise the app uses its built-in hints.') },
  { re: /claude|\bki\b|\bai\b|künstlich|llm|\bapi\b/, go: ['tech', 'data', 2], a: D('Claude ist optional: Es formuliert Tipps und das Fazit für die Lehrkraft. Bewertet wird immer im Code.', 'Claude is optional: it phrases hints and the teacher’s summary. Grading always happens in code.') },
  { re: /python|server|fastapi|sqlite|backend|konto|account/, go: ['tech', 'data', 1], a: D('backend-python/ ist die Server-Version mit FastAPI und SQLite. Start mit run.bat, dann localhost:8000.', 'backend-python/ is the server version with FastAPI and SQLite. Start it with run.bat, then open localhost:8000.') },
  { re: /lücke|gap|agent|ursache|cause/, go: ['tech', 'gaps', 0], a: D('Der Lücken-Agent arbeitet in 5 nachvollziehbaren Schritten: laden, Schwächen, Ursachen, Gruppen, Tipps.', 'The gap finder works in 5 checkable steps: load, weak spots, causes, groups, tips.') },
  { re: /lehrkraft|lehrer|teacher|unterricht|lesson|dashboard/, go: ['biz', 'teacher', 0], a: D('Die Lehrkraft sieht die Klasse auf einen Blick, findet Lücken mit einem Klick und bekommt Gruppen und Tipps für die nächste Stunde.', 'The teacher sees the class at a glance, finds gaps in one click and gets groups and tips for the next lesson.') },
  { re: /bestanden|bestehen|pass|punkte|score/, go: ['biz', 'student', 3], a: D(`Bestanden ist, wer in der ersten Runde mindestens ${PASS} von ${TOTAL} richtig hat.`, `You pass with at least ${PASS} of ${TOTAL} right in the first round.`) },
  { re: /wiederhol|nochmal|again|retry|falsch|wrong|fehler|mistake/, go: ['biz', 'student', 4], a: D('Nur falsche Fragen kommen wieder, Runde für Runde, ab Runde 2 mit Lösungsweg.', 'Only wrong questions come back, round after round, from round 2 with the method.') },
  { re: /lehrplan|curriculum|rlp|berlin/, go: ['biz', 'value', 2], a: RLP },
  { re: /geld|money|preis|price|kosten|cost/, go: ['biz', 'value', 4], a: D('School Hack hat noch kein Preismodell. Die Website kostet nichts im Betrieb: eine Datei, kein Server.', 'School Hack has no pricing model yet. The website costs nothing to run: one file, no server.') },
  { re: /frage|question|test|aufgabe/, go: ['tech', 'test', 0], a: D('Jeder Test hat 30 neue Fragen, zwei pro Skill, aus Vorlagen mit Zufallswerten.', 'Every test has 30 fresh questions, two per skill, from templates with random values.') },
  { re: /wert|value|nutzen|benefit|warum|why|schule|school|business/, go: ['biz', 'value', 0], a: D('Kinder üben ohne Angst, Lehrkräfte sehen Lücken sofort, die Schule bekommt Lehrplan-Treue und Datenschutz.', 'Students practise without fear, teachers see gaps at once, and the school gets curriculum fit and privacy.') },
  { re: /schüler|student|lernreise|journey|kind/, go: ['biz', 'student', 0], a: D('So läuft die Lernreise: anmelden, Test, Tipps, Ergebnis, Fehler üben.', 'Here is the student journey: sign in, test, hints, result, practise mistakes.') },
];
function axGo(lens, flow, step) {
  axPause();
  if (AXS.lens !== lens) { AXS.lens = lens; AXS.flow = flow; AXS.step = step; AXS.sel = null; viewArch(); }
  else if (AXS.flow !== flow) { AXS.flow = flow; }
  axShow(step);
}
function axAsk(q) {
  axSay(null, q, 'me');
  const s = q.toLowerCase(), hit = AX_INTENTS.find(r => r.re.test(s));
  if (hit && hit.sim) return axSim();
  if (hit) { axSay(null, hit.a); return axGo(...hit.go); }
  for (const l of ['tech', 'biz']) { const n = ARCH[l].nodes.find(n => s.includes(n.t.de.toLowerCase()) || s.includes(n.t.en.toLowerCase())); if (n) { if (AXS.lens !== l) { AXS.lens = l; AXS.flow = null; viewArch(); } return axPick(n.id); } }
  axSay(null, UI.axHelp);
}

// simulations reuse the real question engine, grader and gap finder
async function axSim() {
  axPause(); const run = ++AXS.run, ok = () => run === AXS.run && current === viewArch;
  const step = async (flow, i, who, text) => { if (!ok()) return false; if (AXS.flow !== flow) { AXS.flow = flow; } axShow(i, true); axSay(who, text); await sleep(1700); return ok(); };
  axSay(null, UI.axSimNote);
  if (AXS.lens === 'tech') {
    const s = pick(Object.keys(SKILLS)), q = T[s](), traps = Object.keys(q.traps), right = !traps.length || Math.random() < .5;
    const given = right ? (q.kind === 'num' ? String(q.answer) : q.answer) : traps[0];
    const shown = q.kind === 'num' ? `${fmt(given)} ${q.unit}` : L(q.options.find(o => K(o) === given) || given);
    const r = grade(q, given), p = S.mastery[s] ?? .3, p2 = r.ok ? p + .22 * (1 - p) : p - .18 * p;
    if (!await step('test', 0, 'engine', both(l => l === 'de' ? `Neue Frage zu „${SKILLS[s].name.de}“: ${q.prompt.de}` : `New question on “${SKILLS[s].name.en}”: ${q.prompt.en}`))) return;
    if (!await step('test', 1, 'student', both(l => (l === 'de' ? 'Meine Antwort: ' : 'My answer: ') + shown))) return;
    if (!await step('test', 2, 'grader', r.ok ? D('Richtig! Der Code hat es geprüft.', 'Correct! The code checked it.') : both(l => (l === 'de' ? 'Nicht ganz. ' : 'Not quite. ') + (r.msg ? r.msg[l] : q.explanation[l])))) return;
    if (!await step('test', 3, 'grader', r.ok ? D('+10 ⭐ und die Serie wächst.', '+10 ⭐ and the streak grows.') : D('Diese Frage kommt in der nächsten Runde wieder.', 'This question comes back next round.'))) return;
    await step('test', 4, 'store', both(l => `${SKILLS[s].name[l]}: ${Math.round(p * 100)} % → ${Math.round(p2 * 100)} %`));
  } else {
    const d = classData(''), a = analyse(d), w = a.weak[0], g = a.gl[0];
    if (!await step('student', 1, 'test', both(l => l === 'de' ? `${d.kpi.n} Kinder schreiben den Test (Beispieldaten).` : `${d.kpi.n} students take the test (example data).`))) return;
    if (!await step('student', 3, 'result', both(l => l === 'de' ? `${d.kpi.passed} von ${d.kpi.n} bestehen (${d.kpi.pass} %), Ø ${N.de(d.kpi.avg.toFixed(1))} Punkte.` : `${d.kpi.passed} of ${d.kpi.n} pass (${d.kpi.pass} %), avg. ${N.en(d.kpi.avg.toFixed(1))} points.`))) return;
    if (!await step('teacher', 1, 'gapf', w ? both(l => UI.sumGap(SKILLS[w.s].name[l], Math.round(w.mean * 100))[l] + (w.root ? UI.sumRoot(SKILLS[w.root].name[l])[l] : '')) : UI.noGaps)) return;
    if (g && !await step('teacher', 2, 'groups', both(l => l === 'de' ? `${a.gl.length} Fördergruppen. Die größte: „${SKILLS[g[0]].name.de}“ mit ${g[1].length} Kindern.` : `${a.gl.length} support groups. The biggest: “${SKILLS[g[0]].name.en}” with ${g[1].length} students.`))) return;
    if (a.acts[0] && !await step('teacher', 3, 'lesson', both(a.acts[0]))) return;
    await step('teacher', 4, 'again', D('Nächste Woche üben die Gruppen gezielt, und der Lernstand steigt.', 'Next week the groups practise their gap, and progress goes up.'));
  }
}

// deep links: #archify/<tech|biz>/<flow>/<step>/<sim>/<de|en>, used by the README screenshots
(function route() {
  const seg = location.hash.slice(1).split('/');
  if (seg[0] !== 'archify') return viewLogin();
  for (const x of seg.slice(1)) {
    if (x === 'tech' || x === 'biz') AXS.lens = x;
    else if (x === 'de' || x === 'en') { lang = x; document.documentElement.lang = x; }
    else if (/^\d+$/.test(x)) AXS.step = +x;
  }
  const f = seg.find(x => ARCH[AXS.lens].flows[x]); if (f) AXS.flow = f;
  const s = AXS.step; viewArch(); axShow(s);
  if (seg.includes('sim')) axSim();
})();
